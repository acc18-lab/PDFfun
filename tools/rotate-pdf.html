<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rotate PDF Online - PDFfun</title>

    <meta name="description"
          content="Rotate PDF pages online for free with PDFfun. Rotate your PDF and download the result.">

    <link rel="stylesheet"
          href="../css/style.css">


    <style>

        .tool-page {
            min-height: calc(100vh - 72px);

            padding: 70px 20px;

            background:
                radial-gradient(
                    circle at top,
                    #ffe7df,
                    transparent 45%
                ),
                #fffaf7;
        }


        .tool-container {
            max-width: 850px;

            margin: auto;

            text-align: center;
        }


        .tool-container h1 {
            font-size: 48px;

            margin-bottom: 15px;
        }


        .tool-container > p {
            color: #666;

            font-size: 18px;

            margin-bottom: 35px;
        }


        .upload-box {
            background: white;

            border: 2px dashed #e63946;

            border-radius: 18px;

            padding: 55px 25px;

            cursor: pointer;
        }


        .upload-icon {
            font-size: 50px;

            margin-bottom: 15px;
        }


        .upload-box h2 {
            margin-bottom: 8px;
        }


        .upload-box p {
            color: #777;
        }


        #fileInput {
            display: none;
        }


        .file-info {
            display: none;

            margin-top: 25px;

            background: white;

            border: 1px solid #eee;

            border-radius: 12px;

            padding: 20px;
        }


        .file-info strong {
            display: block;

            margin-bottom: 5px;
        }


        .options {
            display: none;

            margin-top: 20px;

            background: white;

            border: 1px solid #eee;

            border-radius: 12px;

            padding: 25px;

            text-align: left;
        }


        .options h3 {
            margin-bottom: 15px;
        }


        .rotation-options {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;
        }


        .rotation-option {
            position: relative;
        }


        .rotation-option input {
            position: absolute;

            opacity: 0;
        }


        .rotation-option label {
            display: block;

            padding: 18px;

            text-align: center;

            border: 1px solid #ddd;

            border-radius: 10px;

            cursor: pointer;

            font-weight: 700;
        }


        .rotation-option input:checked + label {
            border-color: #e63946;

            background: #fff0ed;

            color: #e63946;
        }


        .rotate-button {
            margin-top: 30px;

            padding: 15px 35px;

            border: none;

            border-radius: 9px;

            background: #e63946;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .rotate-button:hover {
            background: #c92f3b;
        }


        .rotate-button:disabled {
            background: #ccc;

            cursor: not-allowed;
        }


        .status {
            margin-top: 20px;

            font-weight: 600;
        }


        @media (max-width: 600px) {

            .rotation-options {
                grid-template-columns: 1fr;
            }

            .tool-container h1 {
                font-size: 40px;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header class="header">

    <div class="logo">

        <span class="logo-icon">
            P
        </span>

        <span>
            PDF<span class="logo-highlight">fun</span>
        </span>

    </div>


    <nav class="navigation">

        <a href="../index.html">
            Home
        </a>

        <a href="../index.html#tools">
            PDF Tools
        </a>

    </nav>

</header>



<!-- TOOL -->

<main class="tool-page">

    <div class="tool-container">


        <div class="badge">
            PDF TOOL
        </div>


        <h1>
            Rotate PDF
        </h1>


        <p>
            Rotate all pages in your PDF and download the result.
        </p>


        <!-- UPLOAD -->

        <div
            class="upload-box"
            onclick="document.getElementById('fileInput').click()">

            <div class="upload-icon">
                🔄
            </div>


            <h2>
                Select a PDF file
            </h2>


            <p>
                Click here to choose your PDF
            </p>


            <input
                type="file"
                id="fileInput"
                accept=".pdf,application/pdf">

        </div>


        <!-- FILE INFO -->

        <div
            id="fileInfo"
            class="file-info">

            <strong id="fileName"></strong>

            <span id="pageCount"></span>

        </div>


        <!-- OPTIONS -->

        <div
            id="options"
            class="options">

            <h3>
                Choose rotation
            </h3>


            <div class="rotation-options">


                <div class="rotation-option">

                    <input
                        type="radio"
                        id="rotate90"
                        name="rotation"
                        value="90"
                        checked>

                    <label for="rotate90">
                        ↻ 90°
                    </label>

                </div>


                <div class="rotation-option">

                    <input
                        type="radio"
                        id="rotate180"
                        name="rotation"
                        value="180">

                    <label for="rotate180">
                        ↻ 180°
                    </label>

                </div>


                <div class="rotation-option">

                    <input
                        type="radio"
                        id="rotate270"
                        name="rotation"
                        value="270">

                    <label for="rotate270">
                        ↺ 270°
                    </label>

                </div>

            </div>

        </div>


        <!-- BUTTON -->

        <button
            id="rotateButton"
            class="rotate-button"
            disabled>

            Rotate PDF

        </button>


        <div
            id="status"
            class="status">
        </div>

    </div>

</main>



<!-- PDF-LIB -->

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>


<script>

    const fileInput =
        document.getElementById(
            "fileInput"
        );


    const fileInfo =
        document.getElementById(
            "fileInfo"
        );


    const fileName =
        document.getElementById(
            "fileName"
        );


    const pageCount =
        document.getElementById(
            "pageCount"
        );


    const options =
        document.getElementById(
            "options"
        );


    const rotateButton =
        document.getElementById(
            "rotateButton"
        );


    const status =
        document.getElementById(
            "status"
        );


    let selectedFile = null;


    /*
        SELECT PDF
    */

    fileInput.addEventListener(
        "change",
        async function () {

            const file =
                this.files[0];


            if (!file) {
                return;
            }


            selectedFile =
                file;


            fileName.textContent =
                file.name;


            try {

                const arrayBuffer =
                    await file.arrayBuffer();


                const pdf =
                    await PDFLib
                        .PDFDocument
                        .load(arrayBuffer);


                pageCount.textContent =
                    pdf.getPageCount() +
                    " page" +
                    (
                        pdf.getPageCount() === 1
                            ? ""
                            : "s"
                    );


                fileInfo.style.display =
                    "block";


                options.style.display =
                    "block";


                rotateButton.disabled =
                    false;


                status.textContent =
                    "";

            }

            catch (error) {

                status.textContent =
                    "Unable to read this PDF.";

            }

        }
    );


    /*
        ROTATE PDF
    */

    rotateButton.addEventListener(
        "click",
        async function () {

            if (!selectedFile) {
                return;
            }


            const degrees =
                parseInt(
                    document.querySelector(
                        'input[name="rotation"]:checked'
                    ).value
                );


            rotateButton.disabled =
                true;


            status.textContent =
                "Rotating PDF...";


            try {

                const arrayBuffer =
                    await selectedFile.arrayBuffer();


                const pdf =
                    await PDFLib
                        .PDFDocument
                        .load(arrayBuffer);


                const pages =
                    pdf.getPages();


                pages.forEach(
                    page => {

                        const currentRotation =
                            page
                                .getRotation()
                                .angle;


                        page.setRotation(
                            PDFLib
                                .degrees(
                                    currentRotation +
                                    degrees
                                )
                        );

                    }
                );


                const pdfBytes =
                    await pdf.save();


                const blob =
                    new Blob(
                        [pdfBytes],
                        {
                            type:
                                "application/pdf"
                        }
                    );


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    url;


                link.download =
                    "PDFfun-Rotated.pdf";


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();


                URL.revokeObjectURL(
                    url
                );


                status.textContent =
                    "PDF rotated successfully.";

            }

            catch (error) {

                console.error(error);


                status.textContent =
                    "Unable to rotate this PDF.";

            }


            rotateButton.disabled =
                false;

        }
    );

</script>


</body>

</html>
