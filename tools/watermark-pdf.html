<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js">
</script>



<script>

const pdfFile =
    document.getElementById("pdfFile");

const fileName =
    document.getElementById("fileName");

const watermarkText =
    document.getElementById("watermarkText");

const position =
    document.getElementById("position");

const fontSize =
    document.getElementById("fontSize");

const opacity =
    document.getElementById("opacity");

const opacityValue =
    document.getElementById("opacityValue");

const watermarkButton =
    document.getElementById("watermarkButton");

const status =
    document.getElementById("status");


let selectedFile = null;


/* FILE SELECTION */

pdfFile.addEventListener(
    "change",
    function () {

        if (!this.files.length) {
            return;
        }

        selectedFile = this.files[0];

        fileName.textContent =
            "Selected: " + selectedFile.name;

        watermarkButton.disabled = false;

        status.textContent = "";

    }
);


/* OPACITY DISPLAY */

opacity.addEventListener(
    "input",
    function () {

        opacityValue.textContent =
            Math.round(
                this.value * 100
            ) + "%";

    }
);


/* ADD WATERMARK */

watermarkButton.addEventListener(
    "click",
    async function () {

        if (!selectedFile) {
            return;
        }


        const text =
            watermarkText.value.trim();


        if (!text) {

            status.className =
                "status error";

            status.textContent =
                "Please enter watermark text.";

            return;

        }


        watermarkButton.disabled = true;

        status.className =
            "status";

        status.textContent =
            "Adding watermark...";


        try {

            const bytes =
                await selectedFile.arrayBuffer();


            const pdfDoc =
                await PDFLib.PDFDocument.load(
                    bytes
                );


            const pages =
                pdfDoc.getPages();


            const font =
                await pdfDoc.embedFont(
                    PDFLib.StandardFonts.Helvetica
                );


            const size =
                Number(fontSize.value);


            const opacityValue =
                Number(opacity.value);


            for (
                const page of pages
            ) {

                const {
                    width,
                    height
                } = page.getSize();


                const textWidth =
                    font.widthOfTextAtSize(
                        text,
                        size
                    );


                const textHeight =
                    font.heightAtSize(
                        size
                    );


                let x;
                let y;


                const margin = 20;


                switch (
                    position.value
                ) {

                    case "top":

                        x =
                            (width - textWidth) / 2;

                        y =
                            height - size - margin;

                        break;


                    case "bottom":

                        x =
                            (width - textWidth) / 2;

                        y =
                            margin;

                        break;


                    case "top-left":

                        x = margin;

                        y =
                            height - size - margin;

                        break;


                    case "top-right":

                        x =
                            width -
                            textWidth -
                            margin;

                        y =
                            height - size - margin;

                        break;


                    case "bottom-left":

                        x = margin;

                        y = margin;

                        break;


                    case "bottom-right":

                        x =
                            width -
                            textWidth -
                            margin;

                        y = margin;

                        break;


                    default:

                        x =
                            (width - textWidth) / 2;

                        y =
                            (height - textHeight) / 2;

                }


                page.drawText(
                    text,
                    {
                        x: x,
                        y: y,

                        size: size,

                        font: font,

                        color:
                            PDFLib.rgb(
                                0.45,
                                0.45,
                                0.45
                            ),

                        opacity:
                            opacityValue
                    }
                );

            }


            const output =
                await pdfDoc.save();


            const blob =
                new Blob(
                    [output],
                    {
                        type:
                            "application/pdf"
                    }
                );


            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement("a");


            link.href = url;

            link.download =
                "PDFfun-Watermarked.pdf";


            link.click();


            URL.revokeObjectURL(url);


            status.textContent =
                "Watermark added successfully.";

        }

        catch (error) {

            console.error(error);

            status.className =
                "status error";

            status.textContent =
                "Could not add the watermark. Please check that the PDF is valid and not encrypted.";

        }


        watermarkButton.disabled = false;

    }
);

</script>
