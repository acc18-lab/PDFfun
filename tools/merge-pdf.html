<!DOCTYPE html>
<html lang="en">

          content="width=device-width, initial-scale=1.0">

    <title>Merge PDF Online Free – Combine PDF Files | PDFfun</title>

    <meta name="description"
          content="Merge multiple PDF files into one document online for free with PDFfun. Combine PDF files quickly and easily without installing software.">

          content="index, follow">

          href="https://pdffun.pdffun-online.workers.dev/tools/merge-pdf.html">

    <link rel="stylesheet"
          href="../css/style.css">

<style>
/* PDFfun tool-page layout */
.tool-page {
    padding: 55px 20px 70px;
}
.tool-container {
    max-width: 900px;
    margin: 0 auto;
}
.tool-container h1 {
    text-align: center;
    font-size: 38px;
    line-height: 1.2;
    margin-bottom: 10px;

}
.tool-container > p {
    text-align: center;
    color: #687184;
    margin-bottom: 30px;
}
.upload-box, .drop-area {
    border: 2px dashed #d9dee7;
    border-radius: 14px;
    padding: 45px 20px;
    text-align: center;
    margin: 30px 0;
    background: #fafbfc;
    cursor: pointer;
}
.upload-box:hover, .drop-area:hover {
    border-color: #e63946;
}
.upload-box input[type="file"], .drop-area input[type="file"] {
    display: none;
}
.upload-box h2, .drop-area h2 {
    margin: 12px 0 6px;
    color: #172033;
}
.file-info, .file-name {
    color: #596273;
}
.file-info {
    display: none;
    text-align: center;
    margin: 20px 0;
}
.status {
    text-align: center;
    margin-top: 18px;
    color: #596273;
}
.info-box, .security-note, .privacy-note {
    margin-top: 20px;
    padding: 15px 18px;
    border-radius: 10px;
    background: #f8f9fb;
    color: #687184;
    font-size: 14px;
}
.options, .conversion-options, .compression-options, .password-box {
    margin: 25px 0;
    padding: 24px;
    background: #f8f9fb;
    border-radius: 12px;
}
.options h3, .conversion-options h3, .compression-options h3, .password-box h3 {
    margin-bottom: 16px;
}
.option-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 9px 0;
}
.option-row select, .options select,
.password-field input, .password-box input {
    padding: 10px 12px;
    border: 1px solid #dce1e8;
    border-radius: 8px;
    background: white;
}
.password-field {
    display: grid;
    gap: 7px;
    margin-bottom: 15px;
}
.password-field input, .password-box input {
    width: 100%;
}
button[class$="-button"]:not(.mobile-menu-button), .primary-button, .convert-button {
    display: block;
    width: 100%;
    border: none;
    border-radius: 9px;
    padding: 14px 20px;
    background: #e63946;
    color: white;
    font-weight: 700;
    cursor: pointer;
    font-size: 16px;
}
button[class$="-button"]:disabled, .convert-button:disabled {
    opacity: .55;
    cursor: not-allowed;
}
.mobile-menu-button {
    display: none;
    border: 0;
    background: transparent;
    font-size: 26px;
    cursor: pointer;
    color: #172033;
}
@media (max-width: 650px) {

        padding: 40px 16px 55px;
    }
    .tool-container h1 {
        font-size: 30px;
    }
    .option-row {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
    }
    .option-row select {
        width: 100%;
    }
    .mobile-menu-button {
        display: block !important;
    }
    .mobile-menu {

    }

}

</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const button = document.getElementById("mobileMenuButton");
    const menu = document.getElementById("mobileMenu");
    if (button && menu) {
        button.addEventListener("click", function () {
            menu.classList.toggle("show");
        });
    }
});
</script>

</head>


<body>

    <!-- HEADER -->
<header class="header">
    <div class="header-inner">
        <a href="../index.html" class="brand">
            <span class="logo-icon">PDF</span>
            <span>PDF<span class="logo-highlight">fun</span></span>
        </a>

        <nav class="navigation">
            <a href="../index.html">Home</a>
            <a href="../index.html#tools">PDF Tools</a>
            <a href="../index.html#how-it-works">How It Works</a>
            <a href="../index.html#faq">FAQ</a>
        </nav>

        <button type="button" class="mobile-menu-button" id="mobileMenuButton" aria-label="Open menu">☰</button>
    </div>

    <div class="mobile-menu" id="mobileMenu">
        <a href="../index.html">Home</a>
        <a href="../index.html#tools">PDF Tools</a>
        <a href="../index.html#how-it-works">How It Works</a>
        <a href="../index.html#faq">FAQ</a>
    </div>
</header>


    <!-- TOOL -->

    <main class="tool-page">

        <div class="tool-container">

<h1>
                Merge PDF
            </h1>

            <p>
                Combine multiple PDF files into one document.
            </p>


            <!-- UPLOAD -->

            <div class="upload-box"
                 onclick="document.getElementById('fileInput').click()">

                <div class="upload-icon">
                    📄
                </div>

                <h2>
                    Select PDF files
                </h2>

                <p>
                    Click here or drag and drop your files
                </p>

                <input
                    type="file"
                    id="fileInput"
                    accept=".pdf,application/pdf"
                    multiple
                >

            </div>


            <!-- FILE LIST -->

            <div
                id="fileList"
                class="file-list">
            </div>


            <!-- MERGE -->

            <button
                id="mergeButton"
                class="merge-button"
                disabled>

                Merge PDFs

            </button>


            <div
                id="status"
                class="status">
            </div>

        </div>

    </main>


    <!-- PDF LIBRARY -->

    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>


    <script>

        const fileInput =
            document.getElementById("fileInput");

        const fileList =
            document.getElementById("fileList");

        const mergeButton =
            document.getElementById("mergeButton");

        const status =
            document.getElementById("status");


        let selectedFiles = [];


        /* FILE SELECTION */

        fileInput.addEventListener(
            "change",
            function () {

                const files =
                    Array.from(this.files);

                selectedFiles =
                    selectedFiles.concat(files);

                displayFiles();

            }
        );


        /* DISPLAY FILES */

        function displayFiles() {

            fileList.innerHTML = "";

            selectedFiles.forEach(
                (file, index) => {

                    const item =
                        document.createElement("div");

                    item.className =
                        "file-item";


                    const name =
                        document.createElement("span");

                    name.className =
                        "file-name";

                    name.textContent =
                        (index + 1) +
                        ". " +
                        file.name;


                    const remove =
                        document.createElement("button");

                    remove.className =
                        "remove-file";

                    remove.textContent =
                        "Remove";


                    remove.onclick =
                        function () {

                            selectedFiles.splice(
                                index,
                                1
                            );

                            displayFiles();

                        };


                    item.appendChild(name);

                    item.appendChild(remove);

                    fileList.appendChild(item);

                }
            );


            mergeButton.disabled =
                selectedFiles.length < 2;

        }


        /* MERGE */

        mergeButton.addEventListener(
            "click",
            async function () {

                if (selectedFiles.length < 2) {

                    alert(
                        "Please select at least two PDF files."
                    );

                    return;

                }


                mergeButton.disabled = true;

                status.textContent =
                    "Merging PDFs...";


                try {

                    const mergedPdf =
                        await PDFLib.PDFDocument.create();


                    for (
                        const file of selectedFiles
                    ) {

                        const arrayBuffer =
                            await file.arrayBuffer();


                        const pdf =
                            await PDFLib.PDFDocument.load(
                                arrayBuffer
                            );


                        const pages =
                            await mergedPdf.copyPages(
                                pdf,
                                pdf.getPageIndices()
                            );


                        pages.forEach(
                            page => {

                                mergedPdf.addPage(page);

                            }
                        );

                    }


                    const mergedPdfBytes =
                        await mergedPdf.save();


                    const blob =
                        new Blob(
                            [mergedPdfBytes],
                            {
                                type:
                                    "application/pdf"
                            }
                        );


                    const url =
                        URL.createObjectURL(blob);


                    const link =
                        document.createElement("a");

                    link.href = url;

                    link.download =
                        "PDFfun-Merged.pdf";


                    document.body.appendChild(link);

                    link.click();

                    link.remove();


                    URL.revokeObjectURL(url);


                    status.textContent =
                        "PDF merged successfully.";

                }

                catch (error) {

                    console.error(error);

                    status.textContent =
                        "Something went wrong. Please check your PDF files.";

                }


                mergeButton.disabled = false;

            }
        );

    </script>

</body>

</html>
