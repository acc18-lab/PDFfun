.options, .conversion-options, .compression-options, .password-box {

button[class$="-button"]:not(.mobile-menu-button), .primary-button, .convert-button {

button[class$="-button"]:disabled, .convert-button:disabled {

<script>

<header class="header">

    <!-- TOOL -->

    <main class="tool-page">

        <div class="tool-container">

<h1>
                Compress PDF
            </h1>

            <p>
                Reduce the size of your PDF for easier sharing and storage.
            </p>


            <!-- UPLOAD -->

            <div
                class="upload-box"
                onclick="document.getElementById('fileInput').click()">

                <div class="upload-icon">
                    📄
                </div>

                <h2>
                    Select a PDF file
                </h2>

                <p>
                    Click here to choose your PDF
                </p>

                <input
                    type="file"
                    id="fileInput"
                    accept=".pdf,application/pdf">

            </div>


            <!-- FILE INFO -->

            <div
                id="fileInfo"
                class="file-info">

                <strong id="fileName"></strong>

                <span id="fileSize"></span>

            </div>


            <!-- OPTIONS -->

            <div
                id="compressionOptions"
                class="compression-options">

                <h3>
                    Choose compression level
                </h3>


                <label class="option">

                    <input
                        type="radio"
                        name="compression"
                        value="recommended"
                        checked>

                    <span class="option-title">
                        Recommended
                    </span>

                    <span class="option-description">
                        Good balance between file size and quality.
                    </span>

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="compression"
                        value="strong">

                    <span class="option-title">
                        Strong compression
                    </span>

                    <span class="option-description">
                        Smaller file size with some quality reduction.
                    </span>

                </label>


                <label class="option">

                    <input
                        type="radio"
                        name="compression"
                        value="extreme">

                    <span class="option-title">
                        Maximum compression
                    </span>

                    <span class="option-description">
                        Prioritize the smallest possible file size.
                    </span>

                </label>

            </div>


            <!-- BUTTON -->

            <button
                id="compressButton"
                class="compress-button"
                disabled>

                Compress PDF

            </button>


            <div
                id="status"
                class="status">
            </div>


            <p class="privacy-note">
                Your files are processed locally whenever supported.
            </p>

        </div>

    </main>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
        type="module"></script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script type="module">

    import * as pdfjsLib
        from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";


    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


    const {
        jsPDF
    } = window.jspdf;


    const fileInput =
        document.getElementById("fileInput");

    const fileInfo =
        document.getElementById("fileInfo");

    const fileName =
        document.getElementById("fileName");

    const fileSize =
        document.getElementById("fileSize");

    const compressionOptions =
        document.getElementById("compressionOptions");

    const compressButton =
        document.getElementById("compressButton");

    const status =
        document.getElementById("status");


    let selectedFile = null;


    /*
        FILE SELECTION
    */

    fileInput.addEventListener(
        "change",
        function () {

            const file =
                this.files[0];

            if (!file) {
                return;
            }


            selectedFile = file;


            fileName.textContent =
                file.name;


            fileSize.textContent =
                "Original size: " +
                formatFileSize(file.size);


            fileInfo.style.display =
                "block";


            compressionOptions.style.display =
                "block";


            compressButton.disabled =
                false;


            status.textContent =
                "";

        }
    );


    /*
        COMPRESS PDF
    */

    compressButton.addEventListener(
        "click",
        async function () {

            if (!selectedFile) {
                return;
            }


            const selectedOption =
                document.querySelector(
                    'input[name="compression"]:checked'
                ).value;


            let jpegQuality;
            let renderScale;


            if (
                selectedOption === "recommended"
            ) {

                jpegQuality = 0.75;
                renderScale = 1.5;

            }

            else if (
                selectedOption === "strong"
            ) {

                jpegQuality = 0.55;
                renderScale = 1.25;

            }

            else {

                jpegQuality = 0.35;
                renderScale = 1.0;

            }


            compressButton.disabled =
                true;


            status.textContent =
                "Loading PDF...";


            try {

                const arrayBuffer =
                    await selectedFile.arrayBuffer();


                const pdf =
                    await pdfjsLib.getDocument({
                        data: arrayBuffer
                    }).promise;


                let outputPdf = null;


                for (
                    let pageNumber = 1;
                    pageNumber <= pdf.numPages;
                    pageNumber++
                ) {

                    status.textContent =
                        "Compressing page " +
                        pageNumber +
                        " of " +
                        pdf.numPages +
                        "...";


                    const page =
                        await pdf.getPage(
                            pageNumber
                        );


                    const viewport =
                        page.getViewport({
                            scale: renderScale
                        });


                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    const context =
                        canvas.getContext(
                            "2d"
                        );


                    canvas.width =
                        Math.ceil(
                            viewport.width
                        );


                    canvas.height =
                        Math.ceil(
                            viewport.height
                        );


                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;


                    const imageData =
                        canvas.toDataURL(
                            "image/jpeg",
                            jpegQuality
                        );


                    const pageWidth =
                        viewport.width /
                        renderScale;


                    const pageHeight =
                        viewport.height /
                        renderScale;


                    if (
                        pageNumber === 1
                    ) {

                        outputPdf =
                            new jsPDF({
                                orientation:
                                    pageWidth >
                                    pageHeight
                                        ? "landscape"
                                        : "portrait",

                                unit: "pt",

                                format: [
                                    pageWidth,
                                    pageHeight
                                ],

                                compress: true
                            });

                    }

                    else {

                        outputPdf.addPage(
                            [
                                pageWidth,
                                pageHeight
                            ],

                            pageWidth >
                            pageHeight
                                ? "landscape"
                                : "portrait"
                        );

                    }


                    outputPdf.addImage(
                        imageData,
                        "JPEG",
                        0,
                        0,
                        pageWidth,
                        pageHeight,
                        undefined,
                        "FAST"
                    );


                    canvas.width = 1;
                    canvas.height = 1;

                }


                status.textContent =
                    "Preparing download...";


                const compressedBlob =
                    outputPdf.output(
                        "blob"
                    );


                const originalSize =
                    selectedFile.size;


                const compressedSize =
                    compressedBlob.size;


                const savings =
                    (
                        (
                            1 -
                            compressedSize /
                            originalSize
                        ) * 100
                    ).toFixed(1);


                const url =
                    URL.createObjectURL(
                        compressedBlob
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href = url;


                link.download =
                    "PDFfun-Compressed.pdf";


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();


                URL.revokeObjectURL(
                    url
                );


                if (
                    compressedSize <
                    originalSize
                ) {

                    status.textContent =
                        "Done! Reduced file size by " +
                        savings +
                        "% (" +
                        formatFileSize(
                            compressedSize
                        ) +
                        ").";

                }

                else {

                    status.textContent =
                        "Done, but this PDF could not be reduced with this compression method. Original: " +
                        formatFileSize(
                            originalSize
                        ) +
                        " | New: " +
                        formatFileSize(
                            compressedSize
                        );

                }

            }

            catch (error) {

                console.error(error);

                status.textContent =
                    "Unable to compress this PDF. Please try another file.";

            }


            compressButton.disabled =
                false;

        }
    );


    /*
        FILE SIZE FORMAT
    */

    function formatFileSize(bytes) {

        if (
            bytes < 1024
        ) {

            return bytes + " B";

        }


        if (
            bytes <
            1024 * 1024
        ) {

            return (
                (
                    bytes /
                    1024
                ).toFixed(1) +
                " KB"
            );

        }


        return (
            (
                bytes /
                (
                    1024 *
                    1024
                )
            ).toFixed(2) +
            " MB"
        );

    }

    </script>

</body>
