<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Word to PDF Converter Online Free | PDFfun</title>

    <meta name="description"
          content="Convert Word DOCX files to PDF online for free with PDFfun. Quickly convert Word documents into PDF files directly in your browser.">

    <meta name="robots"
          content="index, follow">

    <link rel="canonical"
          href="https://pdffun.pdffun-online.workers.dev/tools/word-to-pdf.html">

    <link rel="stylesheet"
          href="../css/style.css">

    <link rel="icon"
          type="image/svg+xml"
          href="../favicon.svg">

<style>
/* PDFfun tool-page layout */
.tool-page {
    padding: 55px 20px 70px;
}
.tool-container {
    max-width: 900px;
    margin: 0 auto;
}
.tool-container h1 {
    text-align: center;
    font-size: 38px;
    line-height: 1.2;
    margin-bottom: 10px;
    color: #172033;
}
.tool-container > p {
    text-align: center;
    color: #687184;
    margin-bottom: 30px;
}
.upload-box, .drop-area {
    border: 2px dashed #d9dee7;
    border-radius: 14px;
    padding: 45px 20px;
    text-align: center;
    margin: 30px 0;
    background: #fafbfc;
    cursor: pointer;
}
.upload-box:hover, .drop-area:hover {
    border-color: #e63946;
}
.upload-box input[type="file"], .drop-area input[type="file"] {
    display: none;
}
.upload-box h2, .drop-area h2 {
    margin: 12px 0 6px;
    color: #172033;
}
.file-info, .file-name {
    color: #596273;
}
.file-info {
    display: none;
    text-align: center;
    margin: 20px 0;
}
.status {
    text-align: center;
    margin-top: 18px;
    color: #596273;
}
.info-box, .security-note, .privacy-note {
    margin-top: 20px;
    padding: 15px 18px;
    border-radius: 10px;
    background: #f8f9fb;
    color: #687184;
    font-size: 14px;
}
.options, .conversion-options, .compression-options, .password-box {
    margin: 25px 0;
    padding: 24px;
    background: #f8f9fb;
    border-radius: 12px;
}
.options h3, .conversion-options h3, .compression-options h3, .password-box h3 {
    margin-bottom: 16px;
}
.option-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 9px 0;
}
.option-row select, .options select,
.password-field input, .password-box input {
    padding: 10px 12px;
    border: 1px solid #dce1e8;
    border-radius: 8px;
    background: white;
}
.password-field {
    display: grid;
    gap: 7px;
    margin-bottom: 15px;
}
.password-field input, .password-box input {
    width: 100%;
}
button[class$="-button"]:not(.mobile-menu-button), .primary-button, .convert-button {
    display: block;
    width: 100%;
    border: none;
    border-radius: 9px;
    padding: 14px 20px;
    background: #e63946;
    color: white;
    font-weight: 700;
    cursor: pointer;
    font-size: 16px;
}
button[class$="-button"]:disabled, .convert-button:disabled {
    opacity: .55;
    cursor: not-allowed;
}
.mobile-menu-button {
    display: none;
    border: 0;
    background: transparent;
    font-size: 26px;
    cursor: pointer;
    color: #172033;
}
@media (max-width: 650px) {
    .tool-page {
        padding: 40px 16px 55px;
    }
    .tool-container h1 {
        font-size: 30px;
    }
    .option-row {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
    }
    .option-row select {
        width: 100%;
    }
    .mobile-menu-button {
        display: block !important;
    }
    .mobile-menu {
        display: none;
    }
    .mobile-menu.show {
        display: flex !important;
        flex-direction: column;
    }
}
@media (min-width: 651px) {
    .mobile-menu-button {
        display: none !important;
    }
}
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const button = document.getElementById("mobileMenuButton");
    const menu = document.getElementById("mobileMenu");
    if (button && menu) {
        button.addEventListener("click", function () {
            menu.classList.toggle("show");
        });
    }
});
</script>

</head>

<body>

<!-- HEADER -->
<header class="header">
    <div class="header-inner">
        <a href="../index.html" class="brand">
            <span class="logo-icon">PDF</span>
            <span>PDF<span class="logo-highlight">fun</span></span>
        </a>

        <nav class="navigation">
            <a href="../index.html">Home</a>
            <a href="../index.html#tools">PDF Tools</a>
            <a href="../index.html#how-it-works">How It Works</a>
            <a href="../index.html#faq">FAQ</a>
        </nav>

        <button type="button" class="mobile-menu-button" id="mobileMenuButton" aria-label="Open menu">☰</button>
    </div>

    <div class="mobile-menu" id="mobileMenu">
        <a href="../index.html">Home</a>
        <a href="../index.html#tools">PDF Tools</a>
        <a href="../index.html#how-it-works">How It Works</a>
        <a href="../index.html#faq">FAQ</a>
    </div>
</header>


<main class="converter-box">

    <h1>Word to PDF</h1>

    <p class="description">
        Convert a Word document into a PDF file.
    </p>


    <label class="drop-area">

        <div class="upload-icon">📄</div>

        <strong>Select a Word document</strong>

        <p>
            Click here to select a .docx file
        </p>

        <input
            type="file"
            id="wordFile"
            accept=".docx"
        >

    </label>


    <div
        class="file-name"
        id="fileName">
    </div>


    <div class="options">

        <label for="pageSize">
            PDF Page Size
        </label>

        <select id="pageSize">

            <option value="a4">
                A4
            </option>

            <option value="letter">
                Letter
            </option>

        </select>

    </div>


    <button
        class="convert-button"
        id="convertButton"
        disabled>

        Convert to PDF

    </button>


    <div
        class="status"
        id="status">
    </div>

</main>


<!-- DOCX reader -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>

<!-- PDF generator -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<script>

const fileInput =
    document.getElementById("wordFile");

const fileName =
    document.getElementById("fileName");

const convertButton =
    document.getElementById("convertButton");

const status =
    document.getElementById("status");

let selectedFile = null;


/* -----------------------------
   FILE SELECTION
----------------------------- */

fileInput.addEventListener("change", function () {

    if (!this.files.length) {
        return;
    }

    selectedFile = this.files[0];

    fileName.textContent =
        "Selected: " + selectedFile.name;

    status.textContent = "";

    convertButton.disabled = false;

});


/* -----------------------------
   CONVERSION
----------------------------- */

convertButton.addEventListener(
    "click",
    async function () {

        if (!selectedFile) {
            return;
        }

        convertButton.disabled = true;

        status.className = "status";

        status.textContent =
            "Reading Word document...";


        try {

            /* Read DOCX */

            const arrayBuffer =
                await selectedFile.arrayBuffer();


            const result =
                await mammoth.extractRawText({
                    arrayBuffer: arrayBuffer
                });


            const text =
                result.value.trim();


            if (!text) {

                throw new Error(
                    "The Word document does not contain readable text."
                );

            }


            status.textContent =
                "Creating PDF...";


            /* Create PDF */

            const { jsPDF } =
                window.jspdf;


            const pageSize =
                document.getElementById(
                    "pageSize"
                ).value;


            const pdf =
                new jsPDF({
                    orientation: "portrait",
                    unit: "mm",
                    format: pageSize
                });


            const pageWidth =
                pdf.internal.pageSize.getWidth();

            const pageHeight =
                pdf.internal.pageSize.getHeight();


            const margin = 15;

            const usableWidth =
                pageWidth - margin * 2;

            const usableHeight =
                pageHeight - margin * 2;


            const fontSize = 11;

            pdf.setFont("helvetica");

            pdf.setFontSize(fontSize);


            /* Convert text into lines */

            const lines =
                pdf.splitTextToSize(
                    text,
                    usableWidth
                );


            let y = margin;


            const lineHeight = 5.5;


            lines.forEach(function (line) {

                if (
                    y + lineHeight >
                    pageHeight - margin
                ) {

                    pdf.addPage();

                    y = margin;

                }


                pdf.text(
                    line,
                    margin,
                    y
                );


                y += lineHeight;

            });


            /* Download */

            pdf.save(
                "PDFfun-Word-Converted.pdf"
            );


            status.textContent =
                "Conversion completed successfully.";


        }

        catch (error) {

            console.error(
                "Word to PDF error:",
                error
            );


            status.className =
                "status error";


            status.textContent =
                "Could not convert this Word document. Please make sure it is a valid .docx file.";

        }


        convertButton.disabled = false;

    }

);

</script>

</body>
</html>
