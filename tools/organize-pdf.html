/* =========================================
   PDFfun TOOL PAGE UI
   ========================================= */

.organize-container,
.watermark-container {

    background: #ffffff;
    border: 1px solid #e8ebf0;

}

.organize-container h1,
.watermark-container h1 {
    text-align: center;
    font-size: 34px;
    line-height: 1.2;

}

.organize-container .description,
.watermark-container .description {
    text-align: center;
    color: #687184;
    margin-bottom: 30px;
}

.upload-area {
    display: block;
    border: 2px dashed #d9dee7;
    border-radius: 14px;
    padding: 42px 20px;
    text-align: center;
    background: #fafbfc;
    cursor: pointer;
    transition: .2s ease;
}

.upload-area:hover {
    border-color: #e63946;
    background: #fffafa;
}

.upload-area .upload-icon {
    font-size: 42px;
    margin-bottom: 12px;
}

.upload-area strong {
    display: block;
    font-size: 17px;
    color: #182033;
    margin-bottom: 6px;
}

.upload-area p {
    color: #747e8f;
    font-size: 14px;
    margin: 0;
}

.upload-area input[type="file"] {
    display: none;
}

.file-name {
    min-height: 22px;
    margin-top: 15px;
    text-align: center;
    color: #596273;
    font-size: 14px;
    font-weight: 600;
}

.pages-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 20px;
    margin-top: 30px;
}

.page-card {
    min-width: 0;
    padding: 12px;
    background: #ffffff;
    border: 1px solid #e1e5eb;
    border-radius: 12px;
    box-shadow: 0 5px 18px rgba(25, 35, 55, .06);
    cursor: grab;

}

.page-card:hover {
    border-color: #e63946;
    transform: translateY(-2px);
}

.page-card.dragging {
    opacity: .5;
}

.page-preview {
    display: block;
    width: 100%;
    height: auto;
    min-height: 170px;
    object-fit: contain;
    background: #f5f6f8;
    border-radius: 7px;
}

.page-number {
    margin-top: 10px;
    text-align: center;

    font-size: 12px;

}

.page-actions {

    gap: 7px;

.page-actions button {

    background: #fff;
    color: #596273;

    font-weight: 700;

}

.page-actions button:hover {

}

.page-actions .delete-page {

}

.controls {

}

.download-button,
.clear-button,
.watermark-button {
    border: 0;
    border-radius: 9px;
    padding: 14px 20px;

    font-weight: 700;

}

.download-button,
.watermark-button {
    width: 100%;
    background: #e63946;
    color: #fff;
}

.clear-button {
    min-width: 110px;
    background: #eef1f5;
    color: #3f4858;
}

.download-button:hover:not(:disabled),
.watermark-button:hover:not(:disabled) {
    background: #c92f3b;
}

.download-button:disabled,
.watermark-button:disabled {
    background: #cfd4dc;
    cursor: not-allowed;
}

.settings {

    grid-template-columns: 1.5fr 1fr 1fr 1.2fr;

.setting label {

.setting input:focus,

.range-row {

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

        type="module"
        id="pdfjs-module">
</script>

<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


const pdfFile =
    document.getElementById("pdfFile");

const fileName =
    document.getElementById("fileName");

const pagesGrid =
    document.getElementById("pagesGrid");

const downloadButton =
    document.getElementById("downloadButton");

const clearButton =
    document.getElementById("clearButton");

const status =
    document.getElementById("status");


let selectedFile = null;
let pdfBytes = null;
let pages = [];


/* =================================
   SELECT PDF
================================= */

pdfFile.addEventListener(
    "change",
    async function () {

        if (!this.files.length) {
            return;
        }

        selectedFile = this.files[0];

        fileName.textContent =
            "Selected: " +
            selectedFile.name;

        status.className = "status";

        status.textContent =
            "Loading PDF pages...";

        pagesGrid.innerHTML = "";

        downloadButton.disabled = true;


        try {

            pdfBytes =
                await selectedFile.arrayBuffer();


            const pdfDoc =
                await PDFLib.PDFDocument.load(
                    pdfBytes
                );


            const pageCount =
                pdfDoc.getPageCount();


            pages = [];


            for (
                let i = 0;
                i < pageCount;
                i++
            ) {

                pages.push({

                    originalIndex: i,

                    rotation: 0

                });

            }


            await renderPages();


            status.textContent =
                pageCount +
                " page" +
                (pageCount === 1
                    ? ""
                    : "s") +
                " loaded.";

            downloadButton.disabled = false;

        }

        catch (error) {

            console.error(error);

            status.className =
                "status error";

            status.textContent =
                "Could not open this PDF. It may be encrypted or invalid.";

        }

    }
);



/* =================================
   RENDER PAGES
================================= */

async function renderPages() {

    pagesGrid.innerHTML = "";


    const loadingTask =
        pdfjsLib.getDocument({
            data: pdfBytes.slice(0)
        });


    const pdf =
        await loadingTask.promise;


    for (
        let index = 0;
        index < pages.length;
        index++
    ) {

        const pageData =
            pages[index];


        const card =
            document.createElement("div");

        card.className =
            "page-card";

        card.draggable = true;

        card.dataset.index =
            index;


        const canvas =
            document.createElement("canvas");

        canvas.className =
            "page-preview";


        const pageNumber =
            document.createElement("div");

        pageNumber.className =
            "page-number";

        pageNumber.textContent =
            "Page " +
            (index + 1) +
            " • Original " +
            (pageData.originalIndex + 1);


        const actions =
            document.createElement("div");

        actions.className =
            "page-actions";


        const rotateButton =
            document.createElement("button");

        rotateButton.textContent =
            "↻ Rotate";


        rotateButton.onclick =
            function (event) {

                event.stopPropagation();

                pageData.rotation =
                    (
                        pageData.rotation +
                        90
                    ) % 360;

                rotateButton.textContent =
                    "↻ " +
                    pageData.rotation +
                    "°";

            };


        const deleteButton =
            document.createElement("button");

        deleteButton.textContent =
            "Delete";

        deleteButton.className =
            "delete-page";


        deleteButton.onclick =
            function (event) {

                event.stopPropagation();


                pages.splice(
                    index,
                    1
                );


                renderPages();

            };


        actions.appendChild(
            rotateButton
        );

        actions.appendChild(
            deleteButton
        );


        card.appendChild(
            canvas
        );

        card.appendChild(
            pageNumber
        );

        card.appendChild(
            actions
        );


        /* DRAG START */

        card.addEventListener(
            "dragstart",
            function () {

                card.classList.add(
                    "dragging"
                );

                card.dataset.dragIndex =
                    index;

            }
        );


        /* DRAG END */

        card.addEventListener(
            "dragend",
            function () {

                card.classList.remove(
                    "dragging"
                );

            }
        );


        /* DRAG OVER */

        card.addEventListener(
            "dragover",
            function (event) {

                event.preventDefault();

            }
        );


        /* DROP */

        card.addEventListener(
            "drop",
            function (event) {

                event.preventDefault();


                const dragging =
                    document.querySelector(
                        ".dragging"
                    );


                if (!dragging) {
                    return;
                }


                const fromIndex =
                    Number(
                        dragging.dataset.dragIndex
                    );


                const toIndex =
                    index;


                if (
                    fromIndex ===
                    toIndex
                ) {

                    return;

                }


                const moved =
                    pages.splice(
                        fromIndex,
                        1
                    )[0];


                pages.splice(
                    toIndex,
                    0,
                    moved
                );


                renderPages();

            }
        );


        pagesGrid.appendChild(
            card
        );


        /* CREATE THUMBNAIL */

        try {

            const pdfPage =
                await pdf.getPage(
                    pageData.originalIndex + 1
                );


            const viewport =
                pdfPage.getViewport({
                    scale: 0.45
                });


            canvas.width =
                viewport.width;

            canvas.height =
                viewport.height;


            const context =
                canvas.getContext("2d");


            await pdfPage.render({

                canvasContext:
                    context,

                viewport:
                    viewport

            }).promise;

        }

        catch (error) {

            console.error(
                "Thumbnail error:",
                error
            );

        }

    }

}



/* =================================
   DOWNLOAD
================================= */

downloadButton.addEventListener(
    "click",
    async function () {

        if (
            !pdfBytes ||
            !pages.length
        ) {

            status.className =
                "status error";

            status.textContent =
                "Please upload a PDF first.";

            return;

        }


        downloadButton.disabled =
            true;


        status.className =
            "status";

        status.textContent =
            "Creating organized PDF...";


        try {

            const sourcePdf =
                await PDFLib.PDFDocument.load(
                    pdfBytes
                );


            const outputPdf =
                await PDFLib.PDFDocument.create();


            const indices =
                pages.map(
                    function (page) {

                        return page.originalIndex;

                    }
                );


            const copiedPages =
                await outputPdf.copyPages(
                    sourcePdf,
                    indices
                );


            copiedPages.forEach(
                function (
                    page,
                    index
                ) {

                    page.setRotation(
                        PDFLib.degrees(
                            pages[index].rotation
                        )
                    );


                    outputPdf.addPage(
                        page
                    );

                }
            );


            const output =
                await outputPdf.save();


            const blob =
                new Blob(
                    [output],
                    {
                        type:
                            "application/pdf"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement("a");


            link.href = url;

            link.download =
                "PDFfun-Organized.pdf";


            document.body.appendChild(
                link
            );

            link.click();

            link.remove();


            URL.revokeObjectURL(
                url
            );


            status.textContent =
                "Organized PDF downloaded successfully.";

        }

        catch (error) {

            console.error(error);

            status.className =
                "status error";

            status.textContent =
                "Could not create the organized PDF.";

        }


        downloadButton.disabled =
            false;

    }
);



/* =================================
   CLEAR
================================= */

clearButton.addEventListener(
    "click",
    function () {

        selectedFile = null;

        pdfBytes = null;

        pages = [];

        pdfFile.value = "";

        fileName.textContent = "";

        pagesGrid.innerHTML = "";

        status.textContent = "";

        downloadButton.disabled =
            true;

    }
);

</script>

    }

document.addEventListener("DOMContentLoaded", function () {
    const button = document.getElementById("mobileMenuButton");
    if (button) {
        button.addEventListener("click", toggleMobileMenu);
    }

</script>
