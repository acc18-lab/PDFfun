<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Organize PDF - PDFfun</title>

    <meta name="description"
          content="Reorder, rotate and delete PDF pages online with PDFfun.">

    <link rel="stylesheet"
          href="../css/style.css">

    <style>

        .organize-container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
        }

        .organize-container h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #687184;
            margin-bottom: 30px;
        }

        .upload-area {
            display: block;
            border: 2px dashed #d8dde6;
            border-radius: 15px;
            padding: 45px 20px;
            text-align: center;
            background: #fafbfc;
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: #e63946;
        }

        .upload-area input {
            display: none;
        }

        .upload-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .file-name {
            text-align: center;
            margin: 18px 0;
            font-weight: 600;
        }

        .pages-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(180px, 1fr));

            gap: 20px;
            margin-top: 30px;
        }

        .page-card {
            position: relative;
            background: white;
            border: 1px solid #dfe3e9;
            border-radius: 12px;
            padding: 12px;
            cursor: grab;
            transition: 0.2s;
        }

        .page-card:hover {
            border-color: #e63946;
            box-shadow:
                0 8px 25px
                rgba(20, 30, 50, 0.08);
        }

        .page-card.dragging {
            opacity: 0.4;
        }

        .page-preview {
            width: 100%;
            height: 220px;
            object-fit: contain;
            background: #f3f5f7;
            border-radius: 8px;
            display: block;
        }

        .page-number {
            text-align: center;
            margin-top: 8px;
            font-size: 13px;
            font-weight: 700;
        }

        .page-actions {
            display: flex;
            gap: 7px;
            margin-top: 10px;
        }

.page-actions button {
    flex: 1;
    border: 1px solid #d8dde6;
    background: white;
    border-radius: 7px;
    padding: 8px 5px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: 0.2s;
}

.page-actions button:hover {
    border-color: #e63946;
    color: #e63946;
}

.page-card {
    user-select: none;
}

.page-card.dragging {
    opacity: 0.45;
    transform: scale(0.97);
}

.page-preview {
    transition: 0.25s;
}

        .page-actions button:hover {
            border-color: #e63946;
            color: #e63946;
        }

        .delete-page {
            color: #d62828;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 35px;
        }

        .controls button {
            padding: 13px 25px;
            border-radius: 9px;
            border: none;
            font-weight: 700;
            cursor: pointer;
        }

        .download-button {
            background: #e63946;
            color: white;
        }

        .download-button:disabled {
            background: #b9bec8;
            cursor: not-allowed;
        }

        .clear-button {
            background: #eef1f5;
            color: #293247;
        }

        .status {
            text-align: center;
            margin-top: 20px;
            color: #687184;
        }

        .error {
            color: #d62828;
        }

        @media (max-width: 600px) {

            .pages-grid {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 12px;
            }

            .page-preview {
                height: 170px;
            }

            .controls {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<header class="header">

    <div class="header-inner">

        <a href="../index.html"
           class="brand">

            <span class="logo-icon">
                PDF
            </span>

            <span>
                PDF<span class="logo-highlight">
                    fun
                </span>
            </span>

        </a>


        <nav class="navigation">

            <a href="../index.html">
                Home
            </a>

            <a href="../index.html#tools">
                PDF Tools
            </a>

            <a href="../index.html#how-it-works">
                How It Works
            </a>

            <a href="../index.html#faq">
                FAQ
            </a>

        </nav>

    </div>

</header>



<main class="organize-container">


    <h1>
        Organize PDF
    </h1>


    <p class="description">
        Reorder, rotate and delete pages from your PDF.
    </p>



    <label class="upload-area">

        <div class="upload-icon">
            📑
        </div>

        <strong>
            Select a PDF
        </strong>

        <p>
            Click here to choose your PDF file
        </p>

        <input
            type="file"
            id="pdfFile"
            accept=".pdf"
        >

    </label>



    <div
        class="file-name"
        id="fileName">
    </div>



    <div
        class="pages-grid"
        id="pagesGrid">
    </div>



    <div class="controls">

        <button
            class="download-button"
            id="downloadButton"
            disabled>

            Download Organized PDF

        </button>


        <button
            class="clear-button"
            id="clearButton">

            Clear

        </button>

    </div>



    <div
        class="status"
        id="status">
    </div>


</main>



<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
        type="module"
        id="pdfjs-module">
</script>

<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


const pdfFile =
    document.getElementById("pdfFile");

const fileName =
    document.getElementById("fileName");

const pagesGrid =
    document.getElementById("pagesGrid");

const downloadButton =
    document.getElementById("downloadButton");

const clearButton =
    document.getElementById("clearButton");

const status =
    document.getElementById("status");


let selectedFile = null;
let pdfBytes = null;
let pages = [];


/* =================================
   SELECT PDF
================================= */

pdfFile.addEventListener(
    "change",
    async function () {

        if (!this.files.length) {
            return;
        }

        selectedFile = this.files[0];

        fileName.textContent =
            "Selected: " +
            selectedFile.name;

        status.className = "status";

        status.textContent =
            "Loading PDF pages...";

        pagesGrid.innerHTML = "";

        downloadButton.disabled = true;


        try {

            pdfBytes =
                await selectedFile.arrayBuffer();


            const pdfDoc =
                await PDFLib.PDFDocument.load(
                    pdfBytes
                );


            const pageCount =
                pdfDoc.getPageCount();


            pages = [];


            for (
                let i = 0;
                i < pageCount;
                i++
            ) {

                pages.push({

                    originalIndex: i,

                    rotation: 0

                });

            }


            await renderPages();


            status.textContent =
                pageCount +
                " page" +
                (pageCount === 1
                    ? ""
                    : "s") +
                " loaded.";

            downloadButton.disabled = false;

        }

        catch (error) {

            console.error(error);

            status.className =
                "status error";

            status.textContent =
                "Could not open this PDF. It may be encrypted or invalid.";

        }

    }
);



/* =================================
   RENDER PAGES
================================= */

async function renderPages() {

    pagesGrid.innerHTML = "";


    const loadingTask =
        pdfjsLib.getDocument({
            data: pdfBytes.slice(0)
        });


    const pdf =
        await loadingTask.promise;


    for (
        let index = 0;
        index < pages.length;
        index++
    ) {

        const pageData =
            pages[index];


        const card =
            document.createElement("div");

        card.className =
            "page-card";

        card.draggable = true;

        card.dataset.index =
            index;


        const canvas =
            document.createElement("canvas");

        canvas.className =
            "page-preview";


        const pageNumber =
            document.createElement("div");

        pageNumber.className =
            "page-number";

        pageNumber.textContent =
            "Page " +
            (index + 1) +
            " • Original " +
            (pageData.originalIndex + 1);


        const actions =
            document.createElement("div");

        actions.className =
            "page-actions";


        const rotateButton =
            document.createElement("button");

        rotateButton.textContent =
            "↻ Rotate";


        rotateButton.onclick =
            function (event) {

                event.stopPropagation();

                pageData.rotation =
                    (
                        pageData.rotation +
                        90
                    ) % 360;

                rotateButton.textContent =
                    "↻ " +
                    pageData.rotation +
                    "°";

            };


        const deleteButton =
            document.createElement("button");

        deleteButton.textContent =
            "Delete";

        deleteButton.className =
            "delete-page";


        deleteButton.onclick =
            function (event) {

                event.stopPropagation();


                pages.splice(
                    index,
                    1
                );


                renderPages();

            };


        actions.appendChild(
            rotateButton
        );

        actions.appendChild(
            deleteButton
        );


        card.appendChild(
            canvas
        );

        card.appendChild(
            pageNumber
        );

        card.appendChild(
            actions
        );


        /* DRAG START */

        card.addEventListener(
            "dragstart",
            function () {

                card.classList.add(
                    "dragging"
                );

                card.dataset.dragIndex =
                    index;

            }
        );


        /* DRAG END */

        card.addEventListener(
            "dragend",
            function () {

                card.classList.remove(
                    "dragging"
                );

            }
        );


        /* DRAG OVER */

        card.addEventListener(
            "dragover",
            function (event) {

                event.preventDefault();

            }
        );


        /* DROP */

        card.addEventListener(
            "drop",
            function (event) {

                event.preventDefault();


                const dragging =
                    document.querySelector(
                        ".dragging"
                    );


                if (!dragging) {
                    return;
                }


                const fromIndex =
                    Number(
                        dragging.dataset.dragIndex
                    );


                const toIndex =
                    index;


                if (
                    fromIndex ===
                    toIndex
                ) {

                    return;

                }


                const moved =
                    pages.splice(
                        fromIndex,
                        1
                    )[0];


                pages.splice(
                    toIndex,
                    0,
                    moved
                );


                renderPages();

            }
        );


        pagesGrid.appendChild(
            card
        );


        /* CREATE THUMBNAIL */

        try {

            const pdfPage =
                await pdf.getPage(
                    pageData.originalIndex + 1
                );


            const viewport =
                pdfPage.getViewport({
                    scale: 0.45
                });


            canvas.width =
                viewport.width;

            canvas.height =
                viewport.height;


            const context =
                canvas.getContext("2d");


            await pdfPage.render({

                canvasContext:
                    context,

                viewport:
                    viewport

            }).promise;

        }

        catch (error) {

            console.error(
                "Thumbnail error:",
                error
            );

        }

    }

}



/* =================================
   DOWNLOAD
================================= */

downloadButton.addEventListener(
    "click",
    async function () {

        if (
            !pdfBytes ||
            !pages.length
        ) {

            status.className =
                "status error";

            status.textContent =
                "Please upload a PDF first.";

            return;

        }


        downloadButton.disabled =
            true;


        status.className =
            "status";

        status.textContent =
            "Creating organized PDF...";


        try {

            const sourcePdf =
                await PDFLib.PDFDocument.load(
                    pdfBytes
                );


            const outputPdf =
                await PDFLib.PDFDocument.create();


            const indices =
                pages.map(
                    function (page) {

                        return page.originalIndex;

                    }
                );


            const copiedPages =
                await outputPdf.copyPages(
                    sourcePdf,
                    indices
                );


            copiedPages.forEach(
                function (
                    page,
                    index
                ) {

                    page.setRotation(
                        PDFLib.degrees(
                            pages[index].rotation
                        )
                    );


                    outputPdf.addPage(
                        page
                    );

                }
            );


            const output =
                await outputPdf.save();


            const blob =
                new Blob(
                    [output],
                    {
                        type:
                            "application/pdf"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement("a");


            link.href = url;

            link.download =
                "PDFfun-Organized.pdf";


            document.body.appendChild(
                link
            );

            link.click();

            link.remove();


            URL.revokeObjectURL(
                url
            );


            status.textContent =
                "Organized PDF downloaded successfully.";

        }

        catch (error) {

            console.error(error);

            status.className =
                "status error";

            status.textContent =
                "Could not create the organized PDF.";

        }


        downloadButton.disabled =
            false;

    }
);



/* =================================
   CLEAR
================================= */

clearButton.addEventListener(
    "click",
    function () {

        selectedFile = null;

        pdfBytes = null;

        pages = [];

        pdfFile.value = "";

        fileName.textContent = "";

        pagesGrid.innerHTML = "";

        status.textContent = "";

        downloadButton.disabled =
            true;

    }
);

</script>


</body>

</html>
